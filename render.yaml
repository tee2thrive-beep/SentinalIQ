services:
  # Python FastAPI Backend Web Service
  - type: web
    name: sentineliq-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SENTINELIQ_ENV
        value: production
      - key: SENTINELIQ_LOG_LEVEL
        value: INFO
      - key: SENTINELIQ_CORS_ORIGINS
        value: "*"

  # React Vite Frontend Static Site
  - type: web
    name: sentineliq-frontend
    env: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
