version: '3.8'

services:
  sentineliq-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentineliq-api
    ports:
      - "8000:8000"
    environment:
      - SENTINELIQ_ENV=production
      - SENTINELIQ_API_HOST=0.0.0.0
      - SENTINELIQ_API_PORT=8000
      - SENTINELIQ_CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:8000
      - SENTINELIQ_LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
